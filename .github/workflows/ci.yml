name: CI

on:
  push:
    branches: [main]
  # Toute pull request, quelle que soit sa base : les PR empilées (base = branche précédente) sont
  # vérifiées comme celles qui visent la branche principale.
  pull_request:

env:
  # À ALIGNER sur la VM de développement (commande `php -v` sur la VM)
  PHP_VERSION: '8.4'

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    # Base MariaDB jetable pour vérifier database/schema.sql.
    # Ces mots de passe ne protègent rien : ce ne sont PAS des secrets.
    services:
      mariadb:
        # À ALIGNER sur la VM de développement (commande `mariadb --version`)
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root_ci
          MARIADB_DATABASE: aura_test
          MARIADB_USER: aura
          MARIADB_PASSWORD: aura_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_mysql, curl
          tools: composer:v2
          # pcov : mesure de couverture des tests (résumé dans le journal, rapport HTML en artefact).
          coverage: pcov

      - name: Valider composer.json
        run: composer validate --strict

      - name: Installer les dépendances
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Vérifier la syntaxe PHP
        run: find src tests public config bin -name '*.php' -print0 | xargs -0 -r -n1 php -l

      - name: Style de code (PSR-12)
        run: composer cs

      - name: Charger le schéma dans MariaDB
        run: docker exec -i ${{ job.services.mariadb.id }} mariadb -u aura -paura_ci aura_test < database/schema.sql
      
      - name: Charger les données de test dans MariaDB                                 
        run: docker exec -i ${{ job.services.mariadb.id }} mariadb -u aura -paura_ci aura_test < database/test.sql

      - name: Tests (unitaires, DAO, intégration, puis HTTP de bout en bout) avec couverture
        # Mêmes valeurs que le service MariaDB ci-dessus (pas des secrets) :
        # lues par config/config.example.php pour le test de connexion.
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: aura_test
          DB_USER: aura
          DB_PASSWORD: aura_ci
        # La couverture compte le code exécuté dans le processus PHPUnit ; les tests HTTP passent par un
        # serveur séparé et n'y entrent pas (ils vérifient le comportement de bout en bout).
        run: vendor/bin/phpunit --coverage-text --only-summary-for-coverage-text --coverage-html build/coverage

      - name: Rapport de couverture (HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: couverture
          path: build/coverage
          if-no-files-found: ignore
